[project]
name = "bundle-common"
version = "0.1.0"
description = "Shared utilities for Bundle services"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bundle_common"]
