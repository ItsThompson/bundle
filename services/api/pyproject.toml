[project]
name = "bundle-api"
version = "0.1.0"
description = "Bundle API service"
requires-python = ">=3.12"
dependencies = [
    "bundle-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
bundle-common = { workspace = true }
