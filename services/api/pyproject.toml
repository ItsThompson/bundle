[project]
name = "bundle-api"
version = "0.1.0"
description = "Bundle API service"
requires-python = ">=3.12"
dependencies = [
    "bundle-common",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.9.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "structlog>=24.0.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
bundle-common = { workspace = true }
